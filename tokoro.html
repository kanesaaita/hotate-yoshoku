<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123a5e">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icon-192.png">
<title>常呂 外海ホタテ 資源・漁獲ダッシュボード</title>
<style>
  :root{
    --navy:#123a5e; --navy2:#1d5b8f; --ice:#eaf3fa; --ice2:#d6e8f4;
    --line:#c9dcea; --ink:#1c2a36; --sub:#5a7186; --bg:#f4f8fb; --card:#ffffff;
    --shadow:0 1px 3px rgba(18,58,94,.08),0 4px 16px rgba(18,58,94,.06);
    --ok:#2e7d5b; --warn:#c2691a;
    --grid:#e6eef5; --axis:#c9dcea; --muted:#7d92a5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;box-shadow:var(--shadow)}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  main{max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .hero{background:linear-gradient(135deg,#0d2e4d,#1d5b8f 70%,#2b74ad);border-radius:18px;padding:18px 16px 14px;color:#fff;box-shadow:0 6px 24px rgba(13,46,77,.25);margin-bottom:16px}
  .hero .hd{font-size:13px;opacity:.9;font-weight:700}
  .hero .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  .hk{background:rgba(255,255,255,.10);border-radius:12px;padding:10px 4px;text-align:center}
  .hk .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
  .hk .v small{font-size:12px;font-weight:700;opacity:.85}
  .hk .l{font-size:10.5px;opacity:.8;margin-top:1px}
  .price-banner{background:linear-gradient(120deg,#eaf6ee,#d9efe2);border:1px solid #b9e4d0;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14.5px;color:#1e5c40}
  .price-flow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:12px 0 6px}
  .price-box{text-align:center;background:var(--ice);border-radius:12px;padding:10px 18px}
  .price-box.big{background:linear-gradient(120deg,var(--navy2),#2b74ad);color:#fff;box-shadow:0 4px 14px rgba(29,91,143,.3)}
  .price-box .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .price-box .v small{font-size:13px;font-weight:700}
  .price-box .l{font-size:11.5px;opacity:.85;font-weight:700;margin-top:1px}
  .price-arrow{font-size:22px;color:var(--navy2);font-weight:800}
  .bar-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
  .bar-row .lbl{flex:0 0 88px;text-align:right;color:var(--sub);font-size:12px;font-weight:700}
  .bar-track{flex:1;background:var(--ice);border-radius:0 6px 6px 0;height:26px;position:relative;overflow:hidden}
  .bar-fill{height:100%;border-radius:0 4px 4px 0;min-width:2px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:11.5px;font-weight:700}
  .bar-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--navy);opacity:.55}
  .bar-row .val{flex:0 0 132px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:2px 0 10px;color:var(--sub)}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--ice);color:var(--navy);font-weight:700}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .sum-row td{background:#fbfdff;font-weight:700;color:var(--navy)}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .tag.hi{background:#eaf6ee;color:var(--ok)}
  .tag.lo{background:#fdf1e4;color:var(--warn)}
  .empty{text-align:center;color:var(--sub);padding:20px;font-size:13px}
  footer{max-width:860px;margin:0 auto;padding:0 16px 28px;font-size:12px;color:var(--sub)}
  footer a{color:var(--navy2)}
  @media(max-width:480px){ .hero .kpis{grid-template-columns:repeat(2,1fr)} .bar-row .lbl{flex-basis:52px} .bar-row .val{flex-basis:118px} }
</style>
</head>
<body>
<header>
  <h1>🐚 常呂 外海ホタテ 資源・漁獲ダッシュボード</h1>
  <div class="sub">漁場別の資源予定量と漁獲進捗＋干貝柱の値決め情報</div>
</header>

<main>
  <div class="hero" id="hero"></div>

  <div class="card">
    <h2>💰 干貝柱 値決め</h2>
    <div id="price"></div>
  </div>

  <div class="card">
    <h2>🗺️ 漁場別の進捗</h2>
    <div class="legend"><span><i class="dot" style="background:#2e7d5b"></i>全体より進んでいる</span><span><i class="dot" style="background:#3987e5"></i>全体並み</span><span><i class="dot" style="background:#c2691a"></i>全体より遅れている</span></div>
    <div id="groundBars"></div>
    <div class="hint">縦線＝全体の進捗率。バーの色は全体進捗との差（±5ポイント以内なら「全体並み」）。</div>
  </div>

  <div class="card">
    <h2>📋 漁場別 資源予定量・漁獲実績</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>漁場</th><th class="num">予定量 (t)</th><th class="num">漁獲済 (t)</th><th class="num">残り (t)</th><th class="num">進捗率</th></tr></thead>
        <tbody id="groundBody"></tbody>
      </table>
    </div>
    <div class="hint" id="tableNote"></div>
  </div>

  <div class="card">
    <h2>📈 進捗の推移</h2>
    <div id="trend"></div>
  </div>
</main>

<footer>
  データはこのページ内に記録されています（端末保存・外部送信なし）。<a href="index.html">ホタテ養殖ツールへ</a>／<a href="tako.html">タコ漁ダッシュボードへ</a>
</footer>

<script>
/* =====================================================================
   資源・漁獲データ（更新はここに1回分ずつ追記するだけ）
   SURVEY: 漁場①〜④ごとの plan「資源予定量(t)」/ caught「漁獲累計(t)」
   進捗率・残りは自動計算。2回分以上たまると推移グラフが出ます。
===================================================================== */
const SURVEY = [
  { date: '2026-07-30', grounds: [
    { no: '①', plan: 6880, caught: 3398 },
    { no: '②', plan: 5680, caught: 3142 },
    { no: '③', plan: 8560, caught: 2478 },
    { no: '④', plan: 4080, caught: 1418 },
  ]},
];

/* 干貝柱の値決め（回ごとに追記）
   up「前年比」/ rawBefore「値決め前の平均生単価(円/kg)」/ rawAfter「値決め後の生単価(円/kg)」 */
const PRICE_LOG = [
  { date: '2026-07-30', round: 1, up: '前年比 50%アップ', rawBefore: 454, rawAfter: 554,
    note: '第一回干貝柱値決め。前年の50%アップに決定。' },
];

const fmtDate = d => { const [y,m,dd] = d.split('-'); return `${m.replace(/^0/,'')}/${dd.replace(/^0/,'')}`; };
const fmtT = n => n.toLocaleString();
const sum = a => a.reduce((s,x)=>s+x,0);
const calc = snap => {
  const plan = sum(snap.grounds.map(g=>g.plan));
  const caught = sum(snap.grounds.map(g=>g.caught));
  return { plan, caught, rest: plan-caught, pct: caught/plan*100 };
};
const latest = SURVEY[SURVEY.length-1];
const tot = calc(latest);
const latestPrice = PRICE_LOG[PRICE_LOG.length-1];

/* ---- ヒーロー（最新時点のKPI） ---- */
(function(){
  document.getElementById('hero').innerHTML = `
    <div class="hd">${fmtDate(latest.date)} 時点　<span style="opacity:.75">｜ 常呂 外海ホタテ（漁場①〜④）</span></div>
    <div class="kpis">
      <div class="hk"><div class="v">${fmtT(tot.plan)}<small>t</small></div><div class="l">資源予定量</div></div>
      <div class="hk"><div class="v">${fmtT(tot.caught)}<small>t</small></div><div class="l">漁獲累計</div></div>
      <div class="hk"><div class="v">${tot.pct.toFixed(1)}<small>%</small></div><div class="l">全体進捗</div></div>
      <div class="hk"><div class="v">${fmtT(tot.rest)}<small>t</small></div><div class="l">残り</div></div>
    </div>`;
})();

/* ---- 干貝柱 値決め ---- */
(function(){
  const p = latestPrice;
  const el = document.getElementById('price');
  if(!p){ el.innerHTML = '<div class="empty">値決めのデータはまだありません</div>'; return; }
  const diff = p.rawAfter - p.rawBefore;
  const diffPct = diff / p.rawBefore * 100;
  const history = PRICE_LOG.length > 1 ? `
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th>日付</th><th>回</th><th>前年比</th><th class="num">生単価 前</th><th class="num">生単価 後</th></tr></thead>
      <tbody>${[...PRICE_LOG].reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>第${x.round}回</td><td>${x.up}</td><td class="num">${x.rawBefore}円</td><td class="num">${x.rawAfter}円</td></tr>`).join('')}</tbody>
    </table></div>` : '';
  el.innerHTML = `
    <div class="price-banner">🎉 <b>第${p.round}回 干貝柱値決め：${p.up}</b>に決定！（${fmtDate(p.date)}）</div>
    <div class="price-flow">
      <div class="price-box"><div class="v">${p.rawBefore}<small>円</small></div><div class="l">現在の平均生単価</div></div>
      <div class="price-arrow">→</div>
      <div class="price-box big"><div class="v">${p.rawAfter}<small>円</small></div><div class="l">値決め後の生単価</div></div>
      <div class="price-box"><div class="v">+${diff}<small>円</small></div><div class="l">上げ幅（+${diffPct.toFixed(1)}%）</div></div>
    </div>
    ${p.note?`<div class="hint">${p.note}</div>`:''}${history}`;
})();

/* ---- 漁場別の進捗バー（色＝全体進捗との差） ---- */
(function(){
  const rows = latest.grounds.map(g=>({ ...g, pct: g.caught/g.plan*100 }));
  const colorOf = pct => pct - tot.pct > 5 ? '#2e7d5b' : tot.pct - pct > 5 ? '#c2691a' : '#3987e5';
  document.getElementById('groundBars').innerHTML = rows.map(g=>`
    <div class="bar-row">
      <div class="lbl">漁場${g.no}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${g.pct}%;background:${colorOf(g.pct)}">${g.pct.toFixed(1)}%</div>
        <div class="bar-mark" style="left:${tot.pct}%"></div>
      </div>
      <div class="val">${fmtT(g.caught)} / ${fmtT(g.plan)}t</div>
    </div>`).join('')
    + `
    <div class="bar-row" style="margin-top:14px">
      <div class="lbl"><b>全体</b></div>
      <div class="bar-track" style="height:30px">
        <div class="bar-fill" style="width:${tot.pct}%;background:linear-gradient(90deg,var(--navy2),var(--navy))">${tot.pct.toFixed(1)}%</div>
      </div>
      <div class="val"><b>${fmtT(tot.caught)} / ${fmtT(tot.plan)}t</b></div>
    </div>`;
})();

/* ---- 漁場別テーブル ---- */
(function(){
  const rows = latest.grounds.map(g=>{
    const pct = g.caught/g.plan*100;
    const tag = pct - tot.pct > 5 ? '<span class="tag hi">進み</span>' : tot.pct - pct > 5 ? '<span class="tag lo">遅れ</span>' : '';
    return `<tr><td>漁場${g.no}</td><td class="num">${fmtT(g.plan)}</td><td class="num">${fmtT(g.caught)}</td><td class="num">${fmtT(g.plan-g.caught)}</td><td class="num">${pct.toFixed(1)}% ${tag}</td></tr>`;
  }).join('');
  document.getElementById('groundBody').innerHTML = rows
    + `<tr class="sum-row"><td>計</td><td class="num">${fmtT(tot.plan)}</td><td class="num">${fmtT(tot.caught)}</td><td class="num">${fmtT(tot.rest)}</td><td class="num">${tot.pct.toFixed(1)}%</td></tr>`;
  document.getElementById('tableNote').textContent =
    `③（残り ${fmtT(latest.grounds[2].plan-latest.grounds[2].caught)}t）と④が全体より遅れ気味。予定量いちばん大きい③の消化がこれからの中心。`;
})();

/* ---- 進捗の推移（2回分以上で表示） ---- */
(function(){
  const el = document.getElementById('trend');
  if(SURVEY.length < 2){
    el.innerHTML = '<div class="empty">データが2回分以上たまると、全体・漁場別の進捗推移がここに表示されます。</div>';
    return;
  }
  el.innerHTML = '<h3 style="margin:0 0 6px;font-size:13px;color:var(--navy2)">全体進捗率</h3>'
    + SURVEY.map(s=>{
      const c = calc(s);
      return `<div class="bar-row"><div class="lbl">${fmtDate(s.date)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${c.pct}%;background:var(--navy2)">${c.pct.toFixed(1)}%</div></div>
        <div class="val">${fmtT(c.caught)} / ${fmtT(c.plan)}t</div></div>`;
    }).join('')
    + '<h3 style="margin:14px 0 6px;font-size:13px;color:var(--navy2)">漁場別 漁獲累計 (t)</h3>'
    + latest.grounds.map((g,gi)=>{
      const pts = SURVEY.map(s=>`${fmtDate(s.date)} ${fmtT(s.grounds[gi].caught)}t`).join(' → ');
      return `<div style="font-size:13px;margin:4px 0"><b>漁場${g.no}</b>：${pts}</div>`;
    }).join('');
})();
</script>
</body>
</html>
